name: CyberpunkMonsterCrawl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CyberpunkMonsterCrawl:
    type: application
    platform: iOS
    sources: [CyberpunkMonsterCrawl]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cyberpunkmonstercrawl
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: CyberpunkMonsterCrawl/CyberpunkMonsterCrawl.entitlements
        # CI hardening — see bootstrap notes.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ENABLE_TESTABILITY: "YES"
  CyberpunkMonsterCrawlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CyberpunkMonsterCrawlTests]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CyberpunkMonsterCrawl.app/CyberpunkMonsterCrawl"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: CyberpunkMonsterCrawl
schemes:
  CyberpunkMonsterCrawl:
    build:
      targets: { CyberpunkMonsterCrawl: all }
    test:
      targets: [CyberpunkMonsterCrawlTests]
      parallelizable: false
