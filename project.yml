name: CyberpunkMonsterCrawl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CyberpunkMonsterCrawl:
    type: application
    platform: iOS
    sources: [CyberpunkMonsterCrawl]
    # SINGLE SOURCE OF TRUTH for the app's Info.plist. XcodeGen does not adopt
    # an existing plist -- it GENERATES the file at `path:` from `properties:`
    # (plus its built-in CFBundle* defaults) and overwrites whatever is on disk
    # on every `xcodegen generate`. So CyberpunkMonsterCrawl/Info.plist is a
    # build product: it is gitignored, is not hand-authored, and must never be
    # hand-edited -- edits there are silently clobbered by ./setup.sh. Add or
    # bump keys HERE.
    #
    # Every key we care about is listed explicitly below rather than left to
    # XcodeGen's defaults, so a version bump is a real diff in this file
    # instead of an invisible revert.
    #
    # Do NOT also set GENERATE_INFOPLIST_FILE/INFOPLIST_FILE by hand: that
    # double-processes the same file (once via this `info:` block, once as a
    # copied resource picked up by the `sources:` glob above) and fails with
    # "Multiple commands produce Info.plist". No UIApplicationSceneManifest key
    # here: the app uses the legacy (non-scene) AppDelegate.window lifecycle,
    # see CyberpunkMonsterCrawlApp.swift.
    info:
      path: CyberpunkMonsterCrawl/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cyberpunkmonstercrawl
        CODE_SIGN_ENTITLEMENTS: CyberpunkMonsterCrawl/CyberpunkMonsterCrawl.entitlements
        # CI hardening — see bootstrap notes.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ENABLE_TESTABILITY: "YES"
  CyberpunkMonsterCrawlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CyberpunkMonsterCrawlTests]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CyberpunkMonsterCrawl.app/CyberpunkMonsterCrawl"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: CyberpunkMonsterCrawl
schemes:
  CyberpunkMonsterCrawl:
    build:
      targets: { CyberpunkMonsterCrawl: all }
    test:
      targets: [CyberpunkMonsterCrawlTests]
      parallelizable: false
