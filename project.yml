name: CyberpunkMonsterCrawl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CyberpunkMonsterCrawl:
    type: application
    platform: iOS
    sources: [CyberpunkMonsterCrawl]
    # XcodeGen manages CyberpunkMonsterCrawl/Info.plist itself (adds the
    # standard CFBundle* keys automatically) -- do NOT also set
    # GENERATE_INFOPLIST_FILE/INFOPLIST_FILE by hand, that double-processes
    # the same file (once via this `info:` block, once as a copied resource
    # picked up by the `sources:` glob above) and fails with "Multiple
    # commands produce Info.plist". No UIApplicationSceneManifest key here:
    # the app uses the legacy (non-scene) AppDelegate.window lifecycle, see
    # CyberpunkMonsterCrawlApp.swift.
    info:
      path: CyberpunkMonsterCrawl/Info.plist
      properties:
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cyberpunkmonstercrawl
        CODE_SIGN_ENTITLEMENTS: CyberpunkMonsterCrawl/CyberpunkMonsterCrawl.entitlements
        # CI hardening — see bootstrap notes.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ENABLE_TESTABILITY: "YES"
  CyberpunkMonsterCrawlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CyberpunkMonsterCrawlTests]
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CyberpunkMonsterCrawl.app/CyberpunkMonsterCrawl"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: CyberpunkMonsterCrawl
schemes:
  CyberpunkMonsterCrawl:
    build:
      targets: { CyberpunkMonsterCrawl: all }
    test:
      targets: [CyberpunkMonsterCrawlTests]
      parallelizable: false
